<header class="header">
  <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
  <nav class="nav-links" aria-label="Primary navigation">
    {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"
         {% if page.url == item.url %}aria-current="page"{% endif %}>
        {{ item.label }}
      </a>
    {% endfor %}
  </nav>
</header>
