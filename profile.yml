headline: Artist, philosopher, veteran, and independent researcher

one_line_bio: >-
  Josh Davila is an artist, philosopher, veteran, and independent researcher
  examining how institutions and technical systems represent, classify, and
  exercise power over human beings.

short_bio: >-
  Josh Davila works across generative art, photography, AI ethics, and
  institutional analysis. Grounded in Kantian ethics and systems thinking,
  his practice examines legitimacy, representation, authorship, data
  ownership, disability, and the practical conditions under which people can
  understand and contest the systems governing their lives.

long_bio: >-
  Josh Davila is an artist, philosopher, U.S. Marine Corps veteran, and
  independent researcher whose work examines institutional legitimacy,
  representation, human agency, and technological power. Working across
  generative art, photography, philosophical writing, and public-interest
  research, he investigates how people are represented and classified by
  systems that claim authority over their lives. His practice is grounded in
  Kantian ethics and a systems-oriented concern with public justification,
  truthful representation, meaningful participation, reciprocity, and the
  ability to contest institutional decisions.

central_question: >-
  Under what conditions may a person, institution, or technical system
  rightfully claim authority over another person's freedom, identity,
  knowledge, property, labor, data, or conduct?

research_thesis: >-
  Human beings are embodied, socially formed, and epistemically situated
  agents whose freedom cannot be protected by abstract rights alone.
  Legitimate institutions must create practical conditions in which people
  can understand rules, contest classifications, give testimony, participate
  in collective reasoning, and retain authorship over their own lives.

